services:
  dev:
    image: python:3.15-trixie
    command: sleep infinity
    working_dir: /workspace
    volumes:
      # Relative to the repo root, because compose.yaml is the first file loaded.
      - .:/workspace
      - dev-venv:/workspace/.venv
      - dev-uv-cache:/root/.cache/uv
    environment:
      UV_LINK_MODE: copy
      UV_PYTHON_DOWNLOADS: never
      DATABASE_URL: postgresql://api_app:api_app_dev_password@db:5432/api
      MIGRATION_DATABASE_URL: postgresql://api_owner:api_owner_dev_password@db:5432/api
      # Tests create and drop their own database here, because there's no Docker inside the container.
      TEST_DATABASE_URL: postgresql://api_owner:api_owner_dev_password@db:5432/postgres
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  dev-venv:
  dev-uv-cache:
