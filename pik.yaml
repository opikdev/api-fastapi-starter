schema: 1
requires:
  - name: uv
    version: 0.13.0
  - name: make
  - name: docker
prompts:
  - name: name
    message: Project name, in kebab-case
    pattern: ^[a-z][a-z0-9-]{0,49}$
    default: "{{dir}}"
  - name: owner
    message: GitHub owner, for README links and code owners
    pattern: ^[A-Za-z0-9-]{1,39}$
    optional: true
replace:
  - from: '"extends": ["config:recommended", "github>opikdev/starters//renovate/baseline"]'
    to: '"extends": ["config:recommended"]'
    files: [renovate.json]
  - from: "## Start your own project\n\nCreate a renamed copy with [pik](https://github.com/opikdev/pik). It downloads this starter's latest release, then sets your project name and GitHub owner:\n\n```sh\npik new api-fastapi-starter my-api\n```\n\nOr select **Use this template** on GitHub. That copy keeps the name `api-fastapi-starter` and the owner `opikdev`, so follow `pik.yaml` by hand: swap the `replace` text, delete the `exclude` paths, and run the `setup` commands.\n\n## Usage\n"
    to: "## Usage\n"
    files: [README.md]
  - from: "opikdev/api-fastapi-starter\ncd api-fastapi-starter\n"
    to: "{{owner}}/{{name}}\ncd {{name}}\n"
    files: [README.md]
  - from: opikdev/api-fastapi-starter
    to: "{{owner}}/{{name}}"
    files: [README.md]
  - from: "@opikdev"
    to: "@{{owner}}"
    files: [.github/CODEOWNERS]
  - from: "# API FastAPI starter\n"
    to: "# {{name}}\n"
    files: [README.md]
  # A new project starts at 0.1.0. Update these with each release; tests/unit/test_pik.py checks.
  - from: "name = \"api-fastapi-starter\"\nversion = \"0.4.1\"\n"
    to: "name = \"api-fastapi-starter\"\nversion = \"0.1.0\"\n"
    files: [pyproject.toml, uv.lock]
  - from: "\"title\": \"api-fastapi-starter\",\n    \"version\": \"0.4.1\"\n"
    to: "\"title\": \"api-fastapi-starter\",\n    \"version\": \"0.1.0\"\n"
    files: [openapi.json]
  # These files hold the bare name only, so one rule renames each of them once.
  - from: api-fastapi-starter
    to: "{{name}}"
    files:
      - .devcontainer/devcontainer.json
      - Dockerfile
      - clients/python/api_client/__init__.py
      - openapi.json
      - Makefile
      - compose.yaml
      - pyproject.toml
      - uv.lock
      - src/app/cli.py
      - src/app/jobs.py
      - src/app/main.py
      - src/app/telemetry.py
      - tests/e2e/test_stack.py
      - tests/integration/test_cli.py
      - tests/integration/test_http.py
exclude:
  - .baseline.sha256
  - .github/workflows/baseline-check.yml
  # It checks this file, which pik removes from the project.
  - tests/unit/test_pik.py
setup:
  - printf '# Changelog\n\nAll notable changes to this project are recorded here. The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).\n\n## [Unreleased]\n' > CHANGELOG.md
  - uv sync
  - uv run ruff format --quiet .
next:
  - docker compose up --build --wait api worker
check:
  - make verify
  - make e2e
