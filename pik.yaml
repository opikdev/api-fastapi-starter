schema: 1
requires:
  - name: uv
    version: 0.13.0
  - name: make
  - name: docker
prompts:
  - name: name
    message: Project name, in kebab-case
    pattern: ^[a-z][a-z0-9-]{0,49}$
    default: "{{dir}}"
  - name: owner
    message: GitHub owner, for README links and code owners
    pattern: ^[A-Za-z0-9-]{1,39}$
    optional: true
replace:
  - from: "opikdev/api-fastapi-starter\ncd api-fastapi-starter\n"
    to: "{{owner}}/{{name}}\ncd {{name}}\n"
    files: [README.md]
  - from: opikdev/api-fastapi-starter
    to: "{{owner}}/{{name}}"
    files: [README.md]
  - from: "@opikdev"
    to: "@{{owner}}"
    files: [.github/CODEOWNERS]
  # These files hold the bare name only, so one rule renames each of them once.
  - from: api-fastapi-starter
    to: "{{name}}"
    files:
      - Dockerfile
      - Makefile
      - compose.yaml
      - pyproject.toml
      - uv.lock
      - src/app/cli.py
      - src/app/jobs.py
      - src/app/main.py
      - src/app/telemetry.py
      - tests/e2e/test_stack.py
exclude:
  - .baseline.sha256
  - .github/workflows/baseline-check.yml
setup:
  - uv sync
  - uv run ruff format --quiet .
next:
  - docker compose up --build --wait api worker
check:
  - make verify
  - make e2e
