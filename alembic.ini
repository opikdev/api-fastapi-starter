[alembic]
script_location = app:migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os

# Lint and format each new revision, so it passes `make lint` as generated.
[post_write_hooks]
hooks = ruff_check, ruff_format
ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root

[handlers]
keys =

[formatters]
keys =

[logger_root]
level = WARNING
handlers =
